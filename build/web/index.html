<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Rilon Maharjan - Personal Portfolio"
  >

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rilon Maharjan">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Rilon Maharjan | Portfolio</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }

    #loading-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    #loading-text {
      font-size: 14px;
      margin-top: 15px;
      opacity: 0.6;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #333333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Loading screen shown while Flutter starts -->
  <div id="loading">
    <div id="loading-title">Rilon Maharjan</div>

    <div class="spinner"></div>

    <div id="loading-text">
      Loading portfolio...
    </div>
  </div>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');

      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease';

        setTimeout(function () {
          loading.remove();
        }, 300);
      }
    });
  </script>

</body>
</html>
